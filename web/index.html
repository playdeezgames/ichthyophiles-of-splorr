<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ichthyophiles of SPLORR!!</title>
<style>
  :root { --bg: #0d2433; --fg: #e8f1f2; --dim: #8fb3bf; --btn: #1f5f75; --btn-hover: #2b7a94; --line: #2a4a5a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 24px 16px; min-height: 80vh; }
  h1 { font-size: 1.5rem; margin: 0 0 1.25rem; letter-spacing: 0.02em; }
  h2 { font-size: 1.25rem; margin: 0 0 0.5rem; color: #ffd27a; }
  p { margin: 0 0 1rem; }
  .stats { margin: 1rem 0; padding-top: 0.75rem; border-top: 1px solid var(--line); }
  .stat { margin: 0.15rem 0; color: var(--dim); font-size: 0.95rem; }
  .buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
  button { font: inherit; font-size: 1rem; color: var(--fg); background: var(--btn); border: 0; border-radius: 6px; padding: 0.5rem 1rem; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--btn-hover); }
  input[type=text] { font: inherit; width: 100%; padding: 0.45rem 0.6rem; border-radius: 6px; border: 1px solid var(--line); background: #071722; color: var(--fg); }
  footer { max-width: 34rem; margin: 0 auto; padding: 16px; text-align: center; font-size: 0.8rem; color: var(--dim); }
  footer a { color: #aaa; }
</style>
</head>
<body>
<main id="game" aria-live="polite"></main>
<footer>
  Ichthyophiles of SPLORR!! by TheGrumpyGameDev. Code and words made by an AI agent (Claude Code) at the author's direction.
  <a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
</footer>
<script src="odin.js"></script>
<script>
"use strict";
(() => {
  const SAVE_KEY = "ichthyophiles-of-splorr-save"; // itch.io serves every game from one origin
  // Order must match Elem_Kind in odin/screens.odin.
  const KIND = ["title", "text", "name", "stat", "button", "textbox"];
  const SAVE_NAME = 7; // Action.Save_Name in odin/screens.odin
  const NAME_MAX = 40;

  const root = document.getElementById("game");
  const memory = new odin.WasmMemoryInterface();
  let pending = [];
  let box = null, boxInitial = null;

  const enc = new TextEncoder();
  const store = (ptr, cap, s) => {
    const bytes = enc.encode(s);
    if (bytes.length > cap) return bytes.length; // Odin treats too long as invalid
    memory.loadBytes(ptr, bytes.length).set(bytes);
    return bytes.length;
  };

  const render = () => {
    // Keep what the player typed in the rename box across the minute refresh.
    const old = box, oldInitial = boxInitial, hadFocus = old && document.activeElement === old;
    root.replaceChildren();
    box = null;
    let stats = null, buttons = null;
    const group = (cls) => { const d = document.createElement("div"); d.className = cls; root.append(d); return d; };
    for (const e of pending) {
      let el;
      switch (KIND[e.kind]) {
        case "title": el = document.createElement("h1"); el.textContent = e.text; root.append(el); break;
        case "name": el = document.createElement("h2"); el.textContent = e.text; root.append(el); break;
        case "text": el = document.createElement("p"); el.textContent = e.text; root.append(el); break;
        case "stat":
          if (!stats) stats = group("stats");
          el = document.createElement("p"); el.className = "stat"; el.textContent = e.text; stats.append(el);
          break;
        case "button":
          if (!buttons || buttons !== root.lastElementChild) buttons = group("buttons");
          el = document.createElement("button");
          el.type = "button"; el.textContent = e.text;
          const action = e.action;
          el.addEventListener("click", () => {
            if (action === SAVE_NAME) memory.exports.on_submit_name();
            else memory.exports.on_click(action);
          });
          buttons.append(el);
          break;
        case "textbox":
          el = document.createElement("input");
          el.type = "text"; el.maxLength = NAME_MAX * 2; el.autocomplete = "off";
          el.setAttribute("aria-label", "Fish name");
          const keep = old && oldInitial === e.text;
          el.value = keep ? old.value : e.text;
          el.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); memory.exports.on_submit_name(); } });
          root.append(el);
          box = el; boxInitial = e.text;
          if (!keep || hadFocus) setTimeout(() => { el.focus(); if (!keep) el.select(); }, 0);
          break;
      }
    }
  };

  odin.runWasm("game.wasm", null, {
    env: {
      now_ms: () => Date.now(),
      dom_clear: () => { pending = []; },
      dom_add: (kind, action, ptr, len) => { pending.push({ kind, action, text: memory.loadString(ptr, len) }); },
      dom_end: render,
      read_text: (ptr, cap) => store(ptr, cap, box ? box.value : ""),
      storage_get: (ptr, cap) => {
        let s = null;
        try { s = localStorage.getItem(SAVE_KEY); } catch (e) { s = null; }
        return s === null ? -1 : store(ptr, cap, s);
      },
      storage_set: (ptr, len) => {
        try { localStorage.setItem(SAVE_KEY, memory.loadString(ptr, len)); } catch (e) { /* private window */ }
      },
    },
  }, memory);

  // The real clock: refresh on each minute, and whenever the tab comes back.
  const tick = () => { if (memory.exports) memory.exports.on_tick(); };
  setTimeout(() => { tick(); setInterval(tick, 60000); }, 60000 - (Date.now() % 60000) + 50);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  window.addEventListener("focus", tick);
})();
</script>
</body>
</html>
